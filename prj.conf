# TensorFlow Lite Micro configuration for activity recognition project
CONFIG_CPP=y
CONFIG_REQUIRES_FULL_LIBC=y
CONFIG_TENSORFLOW_LITE_MICRO=y
CONFIG_TENSORFLOW_LITE_MICRO_CMSIS_NN_KERNELS=y
CONFIG_STD_CPP17=y
CONFIG_NEWLIB_LIBC=y
CONFIG_CMSIS_NN=y
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_FPU=y
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_FPU_SHARING=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_CMSIS_NN_LSTM=y
CONFIG_CMSIS_NN_ACTIVATION=y
CONFIG_CMSIS_NN_BASICMATH=y
CONFIG_CMSIS_NN_CONCATENATION=y
CONFIG_CMSIS_NN_CONVOLUTION=y
CONFIG_CMSIS_NN_FULLYCONNECTED=y
CONFIG_CMSIS_NN_NNSUPPORT=y
CONFIG_CMSIS_NN_POOLING=y
CONFIG_CMSIS_NN_RESHAPE=y
CONFIG_CMSIS_NN_SOFTMAX=y
CONFIG_CMSIS_NN_SVD=y

# LOG
CONFIG_LOG=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_RTT_CONSOLE=n
CONFIG_STDOUT_CONSOLE=n
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=4096  
CONFIG_LOG_BUFFER_SIZE=8192
CONFIG_UART_CONSOLE=n
CONFIG_CONSOLE=n
CONFIG_SERIAL=n

# Enable GPIO
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SPI=y

# Enable multithread
CONFIG_MULTITHREADING=y

# Enable DSP
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_FILTERING=y
CONFIG_CMSIS_DSP_TRANSFORM=y
CONFIG_CMSIS_DSP_STATISTICS=y
CONFIG_CMSIS_DSP_FASTMATH=y
CONFIG_RING_BUFFER=y

# Stack sizes
CONFIG_ISR_STACK_SIZE=1536
CONFIG_IDLE_STACK_SIZE=512
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1536

CONFIG_PM_DEVICE=y
CONFIG_USB_DEVICE_STACK=n
CONFIG_RAM_POWER_DOWN_LIBRARY=y 
CONFIG_PM=y
CONFIG_PM_DEVICE_RUNTIME=y

# nRF54L boards enable nRF Security (PSA crypto, CRACEN) by default for the RNG; this firmware uses no
# cryptography or entropy, so leave it out: ~110 fewer build steps, -6.6 KB flash, -1.6 KB RAM.
CONFIG_NRF_SECURITY=n
